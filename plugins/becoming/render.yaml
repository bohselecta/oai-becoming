# Render Blueprint; the repository root is required for ../../../src/journey.js.
# Import with Blueprint Path plugins/becoming/render.yaml. No fixture is deployed.
services:
  - type: web
    name: becoming-pilot
    runtime: node
    repo: https://github.com/bohselecta/oai-becoming
    branch: codex/becoming-chatgpt-app
    plan: starter
    region: oregon
    numInstances: 1
    autoDeploy: false
    buildCommand: cd plugins/becoming && npm ci --ignore-scripts --omit=dev
    startCommand: cd plugins/becoming && npm start
    healthCheckPath: /health
    disk:
      name: becoming-private-records
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: BIND_ADDRESS
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/becoming/private.sqlite
      - key: PILOT_MODE
        value: "true"
      - key: DATA_KEY_SECRET
        generateValue: true
      # Enter true for the first deploy. sync:false lets the operator later set
      # false without a future blueprint sync undoing the configured OAuth pilot.
      - key: SETUP_MODE
        sync: false
# First deploy only needs SETUP_MODE=true; Render supplies RENDER_EXTERNAL_URL.
# Then add OIDC_ISSUER/CLIENT_ID/CLIENT_SECRET and PILOT_SUBJECTS in Environment,
# verify callback/audience settings, and set SETUP_MODE=false. Do not replace
# DATA_KEY_SECRET: it derives the durable encryption key and account identifiers.
# REVIEWER_SUBJECTS is deliberately absent: add a separate real reviewer only
# when authorized. No default reviewer, test IdP or test participant is included.
