name: ChatGPT app verification
on:
  push:
    branches: ['codex/**', main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: becoming-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: plugins/becoming
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev
      - run: python -m pip install -r ../../tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser acceptance with labeled test-only OAuth and ChatGPT bridge
        run: |
          mkdir -p qa-output
          git rev-parse HEAD > qa-output/source-revision.txt
          git rev-parse HEAD^{tree} > qa-output/source-tree.txt
          python tests/browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: becoming-chatgpt-fixture-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: plugins/becoming/qa-output/
          retention-days: 7
