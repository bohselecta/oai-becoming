name: Apply and verify license and branding
on:
  push:
    branches: ['codex/openai-license-branding']
    paths: ['.delivery/READY.json']
permissions:
  contents: write
concurrency:
  group: becoming-branding-delivery
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply checksum-verified text changes against exact original files
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, shutil
          root = pathlib.Path('.')
          manifest = json.loads((root / '.delivery/READY.json').read_text())
          encoded = ''.join(p.read_text() for p in sorted((root / '.delivery').glob('brand-*.b64')))
          assert len(encoded) == manifest['encoded_bytes'], 'Encoded length mismatch'
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == manifest['packed_sha256'], 'Packed checksum mismatch'
          raw = lzma.decompress(packed)
          assert hashlib.sha256(raw).hexdigest() == manifest['sha256'], 'Source checksum mismatch'
          operations = json.loads(raw)
          assert len(operations) == manifest['files'] == 24
          seen = set()
          for op in operations:
              path = pathlib.PurePosixPath(op['path'])
              assert not path.is_absolute() and not any(part in ['..', '.git', '.github'] for part in path.parts)
              assert str(path) not in seen
              seen.add(str(path))
              target = root / path
              assert not target.is_symlink()
              if op['base_sha256'] is None:
                  assert not target.exists(), 'New path already exists: ' + str(path)
                  text = op['content']
              else:
                  original = target.read_bytes()
                  assert hashlib.sha256(original).hexdigest() == op['base_sha256'], 'Base mismatch: ' + str(path)
                  text = original.decode('utf-8')
                  end = 0
                  for start, stop, replacement in op['edits']:
                      assert isinstance(start, int) and isinstance(stop, int) and isinstance(replacement, str)
                      assert end <= start <= stop <= len(text)
                      end = stop
                  for start, stop, replacement in reversed(op['edits']):
                      text = text[:start] + replacement + text[stop:]
              data = text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == op['sha256'], 'Final mismatch: ' + str(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          shutil.rmtree(root / '.delivery')
          print('Applied 24 verified text changes. Existing measurement code remains unchanged.')
          PY
      - run: npm run check
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify served product, persistence, legal downloads and portable edge cases
        run: |
          node scripts/serve.mjs dist > /tmp/becoming-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          python tests/browser_smoke.py --url http://127.0.0.1:4173 --output qa-output
      - name: Capture actual product screenshot and executed verification receipt
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil
          root = pathlib.Path('.')
          result = json.loads((root / 'qa-output/browser-results.json').read_text())
          assert not result['page_errors'] and result['passed'] >= 238
          run_url = 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
          count = result['passed']
          result.update({'release': '0.2.1', 'workflow_url': run_url, 'domain_tests_passed': 100,
                         'baseline': '08b970442f1dce36b7456c75c425f180ee2ecd67',
                         'source_sha256': {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in [pathlib.Path('LICENSE'), pathlib.Path('package.json'), pathlib.Path('index.html'), *sorted(pathlib.Path('src').glob('*')), *sorted(pathlib.Path('tests').glob('*.mjs')), pathlib.Path('tests/browser_smoke.py')] if p.is_file()}})
          (root / 'docs/verification/0.2.1-hosted.json').write_text(json.dumps(result, indent=2) + '\n')
          shutil.copyfile('qa-output/hero.png', 'public/becoming-preview.png')
          readme = root / 'README.md'
          old = 'The 0.2.0 measurement baseline passed 90 domain tests and 207 hosted-browser assertions. The current patch verification is recorded in [STATUS](docs/STATUS.md); historical results are not relabeled as a new run.'
          new = f'**Verified for 0.2.1:** 100 domain/package tests, 232 local offline assertions, and **{count} served-browser assertions** passed. See [current status](docs/STATUS.md) and the [hosted receipt](docs/verification/0.2.1-hosted.json). Earlier 0.2.0 receipts remain explicitly historical.'
          text = readme.read_text()
          assert old in text
          readme.write_text(text.replace(old, new))
          status = root / 'docs/STATUS.md'
          old = 'The hosted-origin suite must pass in GitHub Actions before merging. Remote results, when available, are recorded separately in `docs/verification/0.2.1-hosted.json`.'
          new = f'The [GitHub hosted-origin run]({run_url}) subsequently passed **100 domain/package tests and {count} browser assertions**, including modular loading, served headers, origin persistence and current/legacy legal downloads. Its separate receipt is `docs/verification/0.2.1-hosted.json`. The README image is the actual updated product captured by that run.'
          text = status.read_text()
          assert old in text
          status.write_text(text.replace(old, new))
          qa = root / 'docs/QA.md'
          old = 'Served-origin patch checks are recorded separately when run in CI.'
          new = f'The subsequent GitHub served-origin patch run passed **{count} browser assertions**; see [its receipt](verification/0.2.1-hosted.json). This was a runner-local HTTP origin, not a Vercel deployment.'
          text = qa.read_text()
          assert old in text
          qa.write_text(text.replace(old, new))
          PY
      - name: Build complete portable distribution with final legal and status documents
        run: npm run check
      - name: Commit verified product and screenshot to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: OpenAI-only new grant and independent ecosystem branding v0.2.1'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: becoming-branding-verification
          path: |
            qa-output/
            dist/
          retention-days: 7
